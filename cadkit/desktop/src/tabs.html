<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CADkit Viewer</title>
  <style>
    /* The tabbed app's own page: the tab strip along the top of the window and, under it when asked for
       (or when no tab is open), the projects list. Dressed as the viewer page is. The shell gives this
       page the strip's height alone while a project is shown, and the whole window while the list is. */
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16181c;
                 color: #c9ced6; font: 14px/1.4 system-ui, sans-serif; user-select: none; }
    #strip { height: 34px; box-sizing: border-box; display: flex; align-items: stretch;
             background: #101216; border-bottom: 1px solid #2a2e36; padding: 0 4px; }
    .tab { display: flex; align-items: center; gap: 7px; min-width: 60px; max-width: 240px;
           padding: 0 6px 0 12px; margin-top: 4px; border: 1px solid transparent; border-bottom: 0;
           border-radius: 8px 8px 0 0; cursor: pointer; opacity: .62; font-size: 13px; }
    .tab:hover { opacity: .9; background: #1c1f25; }
    .tab.on { opacity: 1; background: #16181c; border-color: #333842; color: #e6eaf0;
              box-shadow: 0 1px 0 #16181c; }
    .tab .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    /* built again since it was last looked at */
    .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: #4d84b8; flex: none; display: none; }
    .tab.new .dot { display: block; }
    .x { flex: none; width: 18px; height: 18px; line-height: 17px; text-align: center; border-radius: 5px;
         opacity: .5; font-size: 14px; }
    .x:hover { opacity: 1; background: #333842; }
    #plus { align-self: center; width: 26px; height: 24px; line-height: 22px; margin-left: 4px;
            text-align: center; border-radius: 6px; cursor: pointer; opacity: .6; font-size: 17px; }
    #plus:hover, #plus.on { opacity: 1; background: #23405a; }
    #list { position: absolute; inset: 34px 0 0 0; overflow-y: auto; padding: 22px 28px 28px; display: none; }
    body.list #list { display: block; }
    #list h1 { font-size: 15px; font-weight: 600; color: #e6eaf0; margin: 0 0 4px; }
    #list .sub { opacity: .55; font-size: 12px; margin-bottom: 16px; }
    .proj { display: flex; align-items: baseline; gap: 14px; max-width: 980px; padding: 9px 12px;
            border: 1px solid #333842; border-radius: 8px; background: #1c1f25; margin-bottom: 6px;
            cursor: pointer; }
    .proj:hover { border-color: #4d84b8; }
    .proj b { color: #e6eaf0; font-weight: 600; white-space: nowrap; }
    .proj .dir { flex: 1; min-width: 0; opacity: .5; font-size: 12px; overflow: hidden; white-space: nowrap;
                 text-overflow: ellipsis; direction: rtl; text-align: left; }
    .proj .when { opacity: .7; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .proj .is { font-size: 11px; opacity: .6; text-transform: uppercase; letter-spacing: .06em; }
    .proj.missing { opacity: .4; cursor: default; }
    .proj.missing:hover { border-color: #333842; }
    #none { opacity: .6; max-width: 640px; }
    code { background: #1c1f25; border: 1px solid #333842; border-radius: 4px; padding: 1px 5px; font-size: 12px;
           white-space: nowrap; }
  </style>
</head>
<body>
  <div id="strip"></div>
  <div id="list">
    <h1>Projects</h1>
    <div class="sub" id="sub"></div>
    <div id="rows"></div>
    <div id="none">No project has been opened here yet. A project's build shows itself here; or, in the project's
      folder: <code>py -3.12 -m cadkit.web.desktop</code></div>
  </div>
  <script>
  const post = o => window.ipc.postMessage(JSON.stringify(o));
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls;
                                   if (text != null) e.textContent = text; return e; };
  let state = { tabs: [], list: true, projects: [] };
  // when a model was built, as a person says it
  function when(t) {
    if (!t) return 'no model';
    const d = new Date(t * 1000), now = new Date(), day = 86400000;
    const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) -
                             new Date(d.getFullYear(), d.getMonth(), d.getDate())) / day);
    const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return 'built ' + (days === 0 ? 'today ' + hm : days === 1 ? 'yesterday ' + hm
         : d.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' }) + ' ' + hm);
  }
  // the shell says what there is to show: all of it, each time anything has changed
  window.setState = s => {
    state = s;
    const strip = document.getElementById('strip');
    strip.textContent = '';
    for (const t of s.tabs) {
      const tab = el('div', 'tab' + (t.active && !s.list ? ' on' : '') + (t.dot ? ' new' : ''));
      tab.title = t.dir + (t.dot ? '\nbuilt again since it was last looked at' : '');
      tab.dataset.id = t.id;
      tab.append(el('span', 'dot'), el('span', 'name', t.title));
      const x = el('span', 'x', '×');
      x.title = 'close (Ctrl+W)';
      x.onclick = e => { e.stopPropagation(); post({ t: 'close', id: t.id }); };
      tab.append(x);
      tab.onclick = () => post({ t: 'tab', id: t.id });
      tab.onauxclick = e => { if (e.button === 1) post({ t: 'close', id: t.id }); };
      strip.append(tab);
    }
    const plus = el('div', s.list ? 'on' : '', '+');
    plus.id = 'plus';
    plus.title = 'projects';
    plus.onclick = () => post({ t: 'plus' });
    strip.append(plus);
    document.body.classList.toggle('list', !!s.list);
    const rows = document.getElementById('rows');
    rows.textContent = '';
    for (const p of s.projects || []) {
      const row = el('div', 'proj' + (p.missing ? ' missing' : ''));
      row.title = p.missing ? 'its folder, or the model in it, is gone' : p.dir;
      row.dataset.dir = p.dir;
      row.append(el('b', '', p.name || p.folder), el('span', 'dir', '‎' + p.dir),
                 el('span', 'is', p.missing ? 'missing' : p.open ? 'open' : ''), el('span', 'when', when(p.built)));
      if (!p.missing) row.onclick = () => post({ t: 'open', dir: p.dir });
      rows.append(row);
    }
    document.getElementById('none').style.display = (s.projects || []).length ? 'none' : '';
    document.getElementById('sub').textContent = (s.projects || []).length
      ? 'every project opened here, the one built last first' + (s.note ? ' · ' + s.note : '') : (s.note || '');
  };
  addEventListener('keydown', e => {
    if (e.ctrlKey && !e.altKey && (e.key === 'Tab' || e.key.toLowerCase() === 'w')) {
      e.preventDefault();
      post({ t: 'key', k: e.key === 'Tab' ? (e.shiftKey ? 'prev' : 'next') : 'close' });
    } else if (e.key === 'Escape' && state.list) post({ t: 'plus' });
  });
  addEventListener('contextmenu', e => e.preventDefault());
  post({ t: 'ready' });
  </script>
</body>
</html>
