<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Assembly</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16181c;
                 color: #c9ced6; font: 14px/1.4 system-ui, sans-serif; }
    #view { position: fixed; inset: 0; }
    .label { position: fixed; left: 16px; top: 14px; opacity: .9; pointer-events: none; }
    .label b { color: #e6eaf0; }
    .label .sub { opacity: .6; font-size: 12px; }
    #build { position: fixed; right: 16px; top: 14px; opacity: .5; font-variant-numeric: tabular-nums; }
    .hint { position: fixed; left: 16px; bottom: 14px; opacity: .5; font-size: 12px; max-width: 46vw; }
    /* control legend / buttons — two rows (5 pedals, 5 knee levers) */
    #controls { position: fixed; right: 16px; bottom: 14px;
                display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row > .rl { font-size: 11px; opacity: .45; text-transform: uppercase;
                 letter-spacing: .06em; margin-right: 2px; }
    .pedal { min-width: 84px; padding: 6px 8px; border: 1px solid #333842;
             border-radius: 8px; background: #1c1f25; cursor: pointer; user-select: none;
             transition: background .08s, border-color .08s, box-shadow .08s; }
    .pedal.lever { opacity: .78; }
    .pedal:hover { border-color: #4a515c; }
    .pedal.on { background: #23405a; border-color: #4d84b8;
                box-shadow: 0 0 0 1px #4d84b8 inset; }
    .pedal .k { display: inline-block; min-width: 15px; text-align: center;
                border: 1px solid #454b55; border-radius: 4px; padding: 0 4px;
                margin-right: 6px; font-size: 12px; color: #e6eaf0; }
    .pedal .t { color: #aab2bd; font-size: 11px; font-variant-numeric: tabular-nums; }
    .pedal .t .dn { color: #d08a6a; }        /* lowers read differently to raises */
    .pedal .t .na { opacity: .45; font-style: italic; }
    .pedal.on .t { color: #e6eaf0; }
    #deckbtn { min-width: 0; align-self: flex-end; }
    #fps { position: fixed; right: 16px; top: 34px; opacity: .35; font-size: 11px;
           font-variant-numeric: tabular-nums; text-align: right; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center;
               background: #16181c; transition: opacity .4s; }

    /* ── inspection tools: select / hide / measure ─────────────────────────── */
    #tools { position: fixed; left: 16px; top: 62px; display: flex; flex-direction: column;
             gap: 8px; align-items: flex-start; max-height: calc(100vh - 150px); }
    .bar { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn { padding: 4px 9px; border: 1px solid #333842; border-radius: 7px; background: #1c1f25;
           cursor: pointer; user-select: none; font-size: 12px; color: #c9ced6; }
    .btn:hover { border-color: #4a515c; }
    .btn.on { background: #23405a; border-color: #4d84b8; color: #e6eaf0; }
    .btn .k { opacity: .55; margin-left: 5px; font-size: 11px; }
    .panel { border: 1px solid #2c3038; border-radius: 9px; background: rgba(24, 26, 31, .93);
             padding: 8px 10px; font-size: 12px; min-width: 230px; max-width: 330px; }
    .panel h4 { margin: 0 0 4px; font-size: 11px; font-weight: 600; opacity: .55;
                text-transform: uppercase; letter-spacing: .06em; }
    .panel .name { color: #e6eaf0; font-weight: 600; word-break: break-all; }
    .panel .dim { opacity: .55; }
    #sel, #readout, #partsPanel, #secPanel { display: none; }
    #views .btn { padding: 3px 7px; font-size: 11px; }
    #secVal { width: 74px; background: #121418; border: 1px solid #333842; border-radius: 6px;
              color: #e6eaf0; font: inherit; padding: 2px 5px; }
    #secSlide { width: 100%; margin: 8px 0 0; }
    #readout .v { color: #e6eaf0; font-variant-numeric: tabular-nums; }
    #readout .big { font-size: 17px; color: #ffe08a; font-variant-numeric: tabular-nums; }
    #readout .a { color: #6fd3ff; } #readout .b { color: #ff8fd0; }
    #readout table { border-collapse: collapse; } #readout td { padding: 0 8px 0 0; vertical-align: top; }
    #partsPanel { overflow: hidden; display: none; flex-direction: column; min-height: 0; }
    #partsPanel input { width: 100%; box-sizing: border-box; margin-bottom: 6px; padding: 4px 6px;
                        background: #121418; border: 1px solid #333842; border-radius: 6px;
                        color: #e6eaf0; font: inherit; }
    #plist { overflow-y: auto; min-height: 0; max-height: 46vh; margin: 0 -4px; }
    .fam { display: flex; align-items: center; gap: 6px; padding: 1px 4px; border-radius: 5px;
           cursor: pointer; white-space: nowrap; }
    .fam:hover { background: #23262d; }
    .fam.off { opacity: .4; }
    .fam .eye { width: 14px; text-align: center; opacity: .8; }
    .fam .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
    .fam .n { opacity: .45; margin-left: auto; padding-left: 8px; }
    .dimlabel { position: fixed; transform: translate(-50%, -50%); pointer-events: none;
                background: rgba(18, 20, 24, .9); border: 1px solid #6b5a1e; color: #ffe08a;
                padding: 1px 6px; border-radius: 5px; font-size: 13px;
                font-variant-numeric: tabular-nums; display: none; }
    #status { position: fixed; right: 16px; top: 52px; font-size: 11px; opacity: .55;
              pointer-events: none; text-align: right; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js"
  } }
  </script>
</head>
<body>
  <div id="view"></div>
  <div class="label"><b id="title">Assembly</b>
    <div class="sub"><span id="subtitle"></span><span id="keys"></span><span id="deckhint"><b>space</b> = <span id="deckstate">hide deck</span> (and what comes off with it)</span></div>
  </div>
  <div id="build">build #—</div>
  <div id="fps"></div>
  <div id="status"></div>
  <div id="tools">
    <div class="bar">
      <div class="btn on" id="bSelect">select</div>
      <div class="btn" id="bMeasure">measure<span class="k">m</span></div>
      <div class="btn" id="bParts">parts<span class="k">p</span></div>
      <div class="btn" id="bSection">section<span class="k">c</span></div>
      <div class="btn" id="bLight">light<span class="k">l</span></div>
      <div class="btn" id="bPrinted">as printed<span class="k">k</span></div>
      <div class="btn" id="bShowAll" style="display:none">show all<span class="k">u</span></div>
    </div>
    <div class="bar" id="views">
      <div class="btn vw" data-d="1,0,0">+X</div><div class="btn vw" data-d="-1,0,0">−X</div>
      <div class="btn vw" data-d="0,1,0">+Y</div><div class="btn vw" data-d="0,-1,0">−Y</div>
      <div class="btn vw" data-d="0,0,1">+Z</div><div class="btn vw" data-d="0,0,-1">−Z</div>
      <div class="btn vw" data-d="0.55,-1,0.5">iso</div>
    </div>
    <div class="panel" id="secPanel">
      <h4>section cut</h4>
      <div class="bar">
        <div class="btn ax" data-a="0">X</div><div class="btn ax" data-a="1">Y</div>
        <div class="btn ax" data-a="2">Z</div><div class="btn" id="bFlip">flip</div>
        <input id="secVal" type="number" step="0.1">
      </div>
      <input id="secSlide" type="range" step="0.1">
    </div>
    <div class="panel" id="sel"></div>
    <div class="panel" id="readout"></div>
    <div class="panel" id="partsPanel">
      <input id="pfilter" placeholder="filter parts…" spellcheck="false">
      <div id="plist"></div>
    </div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="dimlabel" id="dimlabel"></div>
  <div id="controls"></div>
  <div id="loading">loading model…</div>

  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { Line2 } from 'three/addons/lines/Line2.js';
  import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
  import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
  import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
  import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

  THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
  THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
  THREE.Mesh.prototype.raycast = acceleratedRaycast;

  const TAU = Math.PI * 2;
  const view = document.getElementById('view');
  const $ = id => document.getElementById(id);

  // ── renderer / scene / camera ────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  // no tone curve: the part colours are display colours already, and a filmic curve
  // over mostly pale plastic washed the whole model out (user, 2026-10-09)
  renderer.toneMapping = THREE.NoToneMapping;
  view.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x16181c);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 20000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // Lighting: ONE key light does most of the work and casts the shadows. The ambient
  // part (room environment at ENV, a hemisphere) is kept LOW: when it led, every face
  // was lit alike and the model read flat and pale. Weak fills keep the side away from
  // the key from falling to black (the last is an up-fill from below).
  const ENV = 0.3;                         // envMapIntensity of every part material
  scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x2a2e36, 0.3));
  const KEY_DIR = new THREE.Vector3(3, 4, 2).normalize();
  const SHADOW_PX = matchMedia('(pointer: coarse)').matches ? 2048 : 4096;
  const key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.castShadow = true;
  key.shadow.mapSize.set(SHADOW_PX, SHADOW_PX);
  key.shadow.bias = -0.0003;
  scene.add(key, key.target);
  for (const [x, y, z, intensity] of [[-3, 2, -2, 0.18], [2, 1, -3, 0.18], [-2, 3, 3, 0.18], [0, -3, 0, 0.18]]) {
    const L = new THREE.DirectionalLight(0xffffff, intensity);
    L.position.set(x, y, z);
    scene.add(L);
  }
  // the shadow map is drawn again only when something that casts one has changed
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.info.autoReset = false;                    // counted per frame, over every pass

  const lineMats = [];
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
    for (const m of lineMats) m.resolution.set(innerWidth, innerHeight);
  });

  // ── the animation rig: per-part pivots (CAD coords) + the copedent ────────
  // Part nodes have identity transforms under a root that converts CAD Z-up ->
  // glTF Y-up, so every pivot centre / axis / direction below is in CAD space
  // and we drive each node's LOCAL matrix directly (no coord conversion here).
  let rig = null, nodes = {}, strings = [];
  const held = new Set();          // pedals engaged by held keys (momentary)
  const latched = new Set();       // pedals engaged by button click (toggle)

  const mrot = new THREE.Matrix4();
  const tA = new THREE.Matrix4(), tB = new THREE.Matrix4();

  function translateNode(name, x, y, z) {
    const o = nodes[name]; if (!o) return;
    o.matrixAutoUpdate = false;
    o.matrix.makeTranslation(x, y, z);
  }
  function spinNode(name, center, axis, angle) {
    const o = nodes[name]; if (!o) return;
    o.matrixAutoUpdate = false;
    const ax = new THREE.Vector3(axis[0], axis[1], axis[2]);
    mrot.makeRotationAxis(ax, angle);
    tA.makeTranslation(center[0], center[1], center[2]);
    tB.makeTranslation(-center[0], -center[1], -center[2]);
    o.matrix.copy(tA).multiply(mrot).multiply(tB);   // T(C)·R·T(-C)
  }
  // A belt clamp SLIDES along its belt and TURNS with it: s mm along `dir` from where it
  // was spliced, turned `angle` about that same line through `origin`.
  function screwNode(name, origin, dir, s, angle) {
    const o = nodes[name]; if (!o) return;
    o.matrixAutoUpdate = false;
    mrot.makeRotationAxis(new THREE.Vector3(dir[0], dir[1], dir[2]), angle);
    tA.makeTranslation(origin[0] + dir[0] * s, origin[1] + dir[1] * s, origin[2] + dir[2] * s);
    tB.makeTranslation(-origin[0], -origin[1], -origin[2]);
    o.matrix.copy(tA).multiply(mrot).multiply(tB);
  }

  // net semitone raise per string index, from all engaged pedals
  function activePedals() {
    const s = new Set([...held, ...latched]);
    return rig.copedent.filter(p => s.has(p.name));
  }
  function targetRaise() {
    const raise = new Array(rig.n_strings).fill(0);
    for (const p of activePedals())
      for (const r of p.raises) raise[r.i] += r.semitones;
    return raise;
  }

  // One eased state per string: `carr` = the carriage's Z offset from its baked pose
  // (every nut on the ceiling). The pulleys and the belt clamp are driven from it, so
  // they always agree with where the nut actually is.
  let curCarr = null, curPress = null;

  // The pedals themselves: each engaged station swings its arm down about the
  // axle through its full throw, and the lobe pushes both feel-cartridge pistons
  // back into their bases. The piston stroke is not a fudge — a flat lobe face at
  // radius rc swept through theta retracts by rc*sin(theta), which is the same
  // relation the arm length was sized from (13.2*sin20 = 4.51 mm).
  function applyPedals(dt, k) {
    if (!rig.pedals) return;
    if (!curPress) curPress = new Array(rig.pedals.length).fill(0);
    const on = new Set(activePedals().map(p => p.pedal));
    for (const p of rig.pedals) {
      curPress[p.i] += ((on.has(p.i) ? 1 : 0) - curPress[p.i]) * k;
      const e = curPress[p.i];
      if (e < 1e-4 && !on.has(p.i)) continue;        // parked: leave it identity
      const ang = p.throw_deg * e * Math.PI / 180;   // signed; pressed = negative
      for (const n of p.swing_nodes) spinNode(n, p.center, p.axis, ang);
      const s = p.lobe_rc * Math.sin(Math.abs(ang)), d = p.piston_dir;
      for (const n of p.piston_nodes) translateNode(n, d[0] * s, d[1] * s, d[2] * s);
    }
  }

  // The knee levers, same idea as the pedals but keyed by control name: each has its
  // own axle centre/axis and a SIGNED throw (an "…R" lever is the design mirrored,
  // which negates the rotation — the exporter checks that against CAD, not by eye).
  const curSwing = {};
  function applyLevers(dt, k) {
    const on = new Set(activePedals().map(p => p.name));
    for (const c of rig.copedent) {
      const L = c.lever; if (!L) continue;
      const e = (curSwing[c.name] = (curSwing[c.name] || 0) +
                 ((on.has(c.name) ? 1 : 0) - (curSwing[c.name] || 0)) * k);
      if (e < 1e-4 && !on.has(c.name)) continue;
      const ang = L.throw_deg * e * Math.PI / 180;
      for (const n of L.swing_nodes) spinNode(n, L.center, L.axis, ang);
      const s = L.lobe_rc * Math.sin(Math.abs(ang)), d = L.piston_dir;
      if (d) for (const n of L.piston_nodes)
        translateNode(n, d[0] * s, d[1] * s, d[2] * s);
    }
  }

  function applyRig(dt) {
    if (!rig) return;
    const g = rig.gains, tgtSt = targetRaise();
    if (!curCarr) curCarr = new Array(rig.n_strings).fill(0);
    const k = 1 - Math.pow(0.0001, dt);              // ~critically damped ease
    applyPedals(dt, k);
    applyLevers(dt, k);
    for (const s of strings) {
      // WHERE THE NUT SITS FOR A PITCH. A string's stretch from slack is proportional to
      // its tension, and pitch goes as the root of tension: open is rig.open_down below the
      // ceiling (where the string was wrapped), and n semitones from open is
      // open_down * 2^(n/6). So the model, drawn as assembled with every nut on the
      // ceiling, TUNES UP to open as the page loads, and a lower runs the nut back up.
      const downTgt = Math.min(Math.max(rig.open_down * Math.pow(2, tgtSt[s.i] / 6), 0),
                               rig.carriage_travel);
      const carrTgt = -(s.rest_dz || 0) - downTgt;   // cancel any baked pose, then tension -Z
      curCarr[s.i] += (carrTgt - curCarr[s.i]) * k;
      for (const n of s.carriage_nodes) translateNode(n, 0, 0, curCarr[s.i]);
      // `down` = how far the nut is below the ceiling. The model is drawn with every nut
      // on the ceiling and every clamp where it is spliced, so pulleys and clamp follow
      // the carriage itself, in the mechanism's own ratios (signs come from the rig).
      const down = -curCarr[s.i] - (s.rest_dz || 0);
      const ang = TAU * g.pulley_turns_per_mm * down;     // 1:1 pulleys
      spinNode(s.screw_pulley.node, s.screw_pulley.center, s.screw_pulley.axis,
               ang * (s.screw_pulley.sign || 1));
      spinNode(s.motor_pulley.node, s.motor_pulley.center, s.motor_pulley.axis,
               ang * (s.motor_pulley.sign || 1));
      const c = s.belt_clamp, bs = c.mm_per_mm * down;
      for (const n of c.nodes) screwNode(n, c.origin, c.dir, bs, c.rad_per_mm * bs);
    }
  }

  // ── control UI (buttons = toggle; keys = momentary hold) ──────────────────
  // Two rows: the five foot pedals, then the five knee levers. Ten controls no
  // longer fit the one 116px row the three-pedal E9 set used.
  function buildPedalUI() {
    const wrap = $('controls');
    wrap.innerHTML = '';
    // the keys as the rig assigns them, not as this page once remembered them
    const ks = g => g.map(p => p.key).join(' ');
    $('keys').innerHTML = rig ? `<b>${ks(rig.copedent.filter(p => 'pedal' in p))}</b> pedals, ` +
      `<b>${ks(rig.copedent.filter(p => !('pedal' in p)))}</b> knee levers (hold to combo) · ` : '';
    const rows = rig ? [['pedals', rig.copedent.filter(p => 'pedal' in p)],
                        ['knees',  rig.copedent.filter(p => !('pedal' in p))]] : [];
    for (const [title, group] of rows) {
      if (!group.length) continue;
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="rl">${title}</span>`;
      for (const p of group) {
        const el = document.createElement('div');
        el.className = 'pedal' + ('pedal' in p ? '' : ' lever');
        el.dataset.name = p.name;
        // signed: this copedent lowers as well as raises, so "3" alone would lie
        const moves = p.raises.length
          ? [...p.raises].sort((a, b) => a.i - b.i).map(r =>
              `<span class="${r.semitones < 0 ? 'dn' : ''}">${r.i + 1}` +
              `${r.semitones > 0 ? '+' : '−'}${Math.abs(r.semitones)}</span>`).join(' ')
          : '<span class="na">unassigned on C6</span>';
        el.innerHTML = `<span class="k">${p.key}</span><b>${p.name}</b>` +
                       `<div class="t">${moves}</div>`;
        el.onclick = () => { latched.has(p.name) ? latched.delete(p.name)
                                                 : latched.add(p.name); syncUI(); };
        row.appendChild(el);
      }
      wrap.appendChild(row);
    }
    // the deck toggle as a BUTTON: space does not exist on a phone
    if (!(rig && rig.deck_prefixes)) return;
    const d = document.createElement('div');
    d.className = 'pedal'; d.id = 'deckbtn';
    d.innerHTML = '<span class="k">space</span><b>hide deck</b>';
    d.onclick = toggleDeck;
    wrap.appendChild(d);
  }
  function syncUI() {
    const on = new Set([...held, ...latched]);
    for (const el of document.querySelectorAll('.pedal[data-name]'))
      el.classList.toggle('on', on.has(el.dataset.name));
  }
  const keyToPedal = {};   // '1' -> 'A'
  let deckVisible = true;
  function deckParts() {
    const pre = (rig && rig.deck_prefixes) || [];
    return M.list.filter(p => pre.some(x => p.name.startsWith(x)));
  }
  function toggleDeck() {
    act(() => { deckVisible = !deckVisible; setHidden(deckParts(), !deckVisible); });
    $('deckstate').textContent = deckVisible ? 'hide deck' : 'show deck';
    const b = $('deckbtn');
    if (b) { b.classList.toggle('on', !deckVisible);
             b.querySelector('b').textContent = deckVisible ? 'hide deck' : 'show deck'; }
  }
  function movingNames() {
    const s = new Set();
    if (!rig) return s;
    for (const st of rig.strings) {
      for (const n of st.carriage_nodes) s.add(n);
      s.add(st.screw_pulley.node); s.add(st.motor_pulley.node);
      for (const n of st.belt_clamp.nodes) s.add(n);
    }
    for (const p of rig.pedals || []) for (const n of [...p.swing_nodes, ...p.piston_nodes]) s.add(n);
    for (const c of rig.copedent) if (c.lever)
      for (const n of [...c.lever.swing_nodes, ...(c.lever.piston_nodes || [])]) s.add(n);
    return s;
  }

  // ── THE MODEL: ONE DRAW CALL PER MATERIAL, AND EVERY PART STILL ADDRESSABLE ───────
  // The GLB (tools/web_export.py) is one mesh per part, positions and indices only,
  // triangles sorted by CAD face. Parts that never move are merged into one mesh per
  // material -- draw calls, not triangles, are what a frame rate dies of -- but each
  // keeps its run of the merged index, so a part can still be picked (the run a hit
  // triangle falls in), hidden (the drawn index is rewritten without its run) and
  // highlighted (its run drawn again in another colour). A part the rig moves keeps its
  // own node.
  const M = { root: null, parts: null, list: [], byName: new Map(), batches: [], pickables: [],
              key: '', geo: null, geoPromise: null };
  const matCache = new Map();
  function partMaterial(src) {
    const c = src.color, a = src.opacity ?? 1;
    const key = c.getHexString() + ':' + a.toFixed(3);
    if (!matCache.has(key))
      matCache.set(key, new THREE.MeshStandardMaterial({
        color: c.clone(), metalness: 0, roughness: 0.65, side: THREE.DoubleSide, clipShadows: true,
        envMapIntensity: ENV,
        transparent: a < 0.999, opacity: a }));
    return matCache.get(key);
  }
  // a board's real components are meshes of their own, named <board part>__<ref>, but a
  // board and everything on it is ONE thing to select, hide and list (its `unit`); only
  // the measure tool looks at a single component
  const unitOf = n => n.split('__')[0];
  const family = n => unitOf(n).replace(/(_\d+)+$/, '');
  // a part of many colours (a component model) carries them per vertex, under one white material
  const vcMat = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, metalness: 0.1,
                                                 roughness: 0.6, side: THREE.DoubleSide, clipShadows: true,
                                                 envMapIntensity: ENV });

  // ── as printed ───────────────────────────────────────────────────────────────────
  // The build colours every part differently so they can be told apart. This view
  // shows the instrument as it comes off the printer instead: every part of one
  // filament in that filament's colour AND finish. Glass-filled PETG is matte (the
  // fibre breaks up the surface, so it barely reflects); PCTG is a glossy plastic and
  // picks up the room; TPU is dull rubber. Bought parts keep their colours.
  const PRINT = {
    'petg-gf': new THREE.MeshStandardMaterial({ color: 0x17181a, metalness: 0, roughness: 0.92,
      side: THREE.DoubleSide, clipShadows: true, envMapIntensity: 0.25 }),
    'pctg': new THREE.MeshStandardMaterial({ color: 0x14401f, metalness: 0, roughness: 0.22,
      side: THREE.DoubleSide, clipShadows: true, envMapIntensity: 1.0 }),
    // the deck's second colour (its fret lines and markers): not chosen yet, so a pale one
    'pctg-alt': new THREE.MeshStandardMaterial({ color: 0xd9d6c8, metalness: 0, roughness: 0.22,
      side: THREE.DoubleSide, clipShadows: true, envMapIntensity: 1.0 }),
    'tpu': new THREE.MeshStandardMaterial({ color: 0x101011, metalness: 0, roughness: 1.0,
      side: THREE.DoubleSide, clipShadows: true, envMapIntensity: 0.15 }),
  };
  let asPrinted = false;
  try { asPrinted = sessionStorage.getItem('as-printed') === '1'; } catch {}

  function buildModel(gltf) {
    const root = gltf.scene;
    let parts = root;
    while (parts.children.length === 1 && !parts.children[0].isMesh) parts = parts.children[0];
    M.root = root; M.parts = parts;
    M.list = []; M.byName = new Map(); M.units = new Map(); M.batches = []; M.pickables = [];
    nodes = {};
    const moving = movingNames();
    const groups = new Map();
    for (const mesh of [...parts.children]) {
      if (!mesh.isMesh) continue;
      const g = mesh.geometry, col = g.attributes.color ? g.attributes.color.array : null;
      const printed = asPrinted && !col && PRINT[mesh.userData.mat];
      const mat = col ? vcMat : printed || partMaterial(mesh.material);
      const unit = mesh.userData.unit || unitOf(mesh.name);      // a board's lettering names its board
      const p = { name: mesh.name, unit, family: family(unit), mat, hidden: false, col,
                  pos: g.attributes.position.array, idx: g.index.array,
                  dynamic: moving.has(mesh.name), mesh: null, batch: null,
                  vStart: 0, iStart: 0, iCount: g.index.count };
      M.list.push(p); M.byName.set(p.name, p);
      if (!M.units.has(p.unit)) M.units.set(p.unit, []);
      M.units.get(p.unit).push(p);
      if (p.dynamic) {
        g.computeVertexNormals();
        g.computeBoundsTree({ indirect: true });
        mesh.material = mat; mesh.userData.part = p;
        mesh.castShadow = mesh.receiveShadow = true;
        p.mesh = mesh; nodes[p.name] = mesh;
        M.pickables.push(mesh);
      } else {
        if (!groups.has(mat)) groups.set(mat, []);
        groups.get(mat).push(p);
        mesh.removeFromParent();
      }
    }
    for (const [mat, ps] of groups) {
      let nv = 0, ni = 0;
      for (const p of ps) { p.vStart = nv; p.iStart = ni; nv += p.pos.length / 3; ni += p.iCount; }
      const pos = new Float32Array(nv * 3), full = new Uint32Array(ni);
      const cols = mat === vcMat ? new Uint8Array(nv * 4).fill(255) : null;
      for (const p of ps) {
        pos.set(p.pos, p.vStart * 3);
        if (cols && p.col) cols.set(p.col, p.vStart * 4);
        const o = p.vStart, src = p.idx;
        for (let i = 0; i < src.length; i++) full[p.iStart + i] = src[i] + o;
        p.pos = pos.subarray(p.vStart * 3, p.vStart * 3 + p.pos.length);
        p.idx = null;
      }
      const pickGeo = new THREE.BufferGeometry();
      pickGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      pickGeo.setIndex(new THREE.BufferAttribute(full, 1));
      pickGeo.computeVertexNormals();
      const drawGeo = new THREE.BufferGeometry();
      drawGeo.setAttribute('position', pickGeo.attributes.position);
      drawGeo.setAttribute('normal', pickGeo.attributes.normal);
      if (cols) drawGeo.setAttribute('color', new THREE.BufferAttribute(cols, 4, true));
      drawGeo.setIndex(new THREE.BufferAttribute(full.slice(), 1));
      drawGeo.boundingSphere = null; drawGeo.computeBoundingSphere();
      const draw = new THREE.Mesh(drawGeo, mat);
      draw.castShadow = draw.receiveShadow = true;
      const pick = new THREE.Mesh(pickGeo, mat);
      pick.visible = false;                     // raycast only: the ray does not test visibility
      const b = { mat, parts: ps, full, draw, pick, drawGeo, pickGeo,
                  starts: Uint32Array.from(ps, p => p.iStart / 3) };
      for (const p of ps) p.batch = b;
      pick.userData.batch = b;
      parts.add(draw); parts.add(pick);
      M.batches.push(b); M.pickables.push(pick);
    }
    scene.add(root);
    root.updateWorldMatrix(true, true);
    // the trees cost about a second on the whole instrument: after the first frame
    setTimeout(() => { for (const b of M.batches) b.pickGeo.computeBoundsTree({ indirect: true }); }, 50);
  }
  function disposeModel() {
    if (!M.root) return;
    clearSelection(); clearMeasure(); rtDrop();
    scene.remove(M.root);
    for (const b of M.batches) { b.pickGeo.disposeBoundsTree(); b.pickGeo.dispose(); b.drawGeo.dispose(); }
    for (const p of M.list) if (p.mesh) { p.mesh.geometry.disposeBoundsTree(); p.mesh.geometry.dispose(); }
    M.root = null; M.geo = null; M.geoPromise = null;
  }

  // ── hiding ───────────────────────────────────────────────────────────────────────
  function redrawBatch(b) {
    const out = b.drawGeo.index.array;
    let n = 0;
    for (const p of b.parts) if (!p.hidden) {
      out.set(b.full.subarray(p.iStart, p.iStart + p.iCount), n); n += p.iCount;
    }
    b.drawGeo.index.needsUpdate = true;
    b.drawGeo.setDrawRange(0, n);
    b.draw.visible = n > 0;
  }
  function setHidden(ps, hidden) {
    const dirty = new Set();
    for (const p of ps) {
      if (p.hidden === hidden) continue;
      p.hidden = hidden;
      if (p.mesh) p.mesh.visible = !hidden; else dirty.add(p.batch);
    }
    for (const b of dirty) redrawBatch(b);
    lightDirty = true;
    if (hidden) { const s = new Set(ps); selection = selection.filter(p => !s.has(p)); drawSelection(); }
    syncPartsUI();
  }
  const hiddenParts = () => M.list.filter(p => p.hidden);
  function showAll() { act(() => { setHidden(hiddenParts(), false); deckVisible = true; syncDeckUI(); }); }

  // ── undo / redo of what is shown (ctrl+z, ctrl+y) ────────────────────────────────
  // A step is the whole set of hidden part NAMES, so it survives a model reload.
  const undoStack = [], redoStack = [];
  const visState = () => ({ names: hiddenParts().map(p => p.name), deck: deckVisible });
  const sameVis = (a, b) => a.deck === b.deck && a.names.length === b.names.length
                            && a.names.every((n, i) => n === b.names[i]);
  function act(fn) {                       // run a change to what is shown, as one step
    const before = visState();
    fn();
    if (sameVis(before, visState())) return;
    undoStack.push(before); redoStack.length = 0;
    if (undoStack.length > 200) undoStack.shift();
  }
  function restoreVis(s) {
    const want = new Set(s.names);
    setHidden(M.list.filter(p => p.hidden && !want.has(p.name)), false);
    setHidden(M.list.filter(p => !p.hidden && want.has(p.name)), true);
    deckVisible = s.deck; syncDeckUI();
  }
  function undo(redo = false) {
    const from = redo ? redoStack : undoStack, to = redo ? undoStack : redoStack;
    if (!from.length) return false;
    to.push(visState()); restoreVis(from.pop());
    return true;
  }
  function syncDeckUI() {
    $('deckstate').textContent = deckVisible ? 'hide deck' : 'show deck';
    const b = $('deckbtn');
    if (b) { b.classList.toggle('on', !deckVisible);
             b.querySelector('b').textContent = deckVisible ? 'hide deck' : 'show deck'; }
  }

  // ── picking ──────────────────────────────────────────────────────────────────────
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  function pickAt(cx, cy) {
    if (!M.root) return null;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    ray.firstHitOnly = false;
    for (const h of ray.intersectObjects(M.pickables, false)) {
      let p, tri;
      const b = h.object.userData.batch;
      if (b) {
        let lo = 0, hi = b.starts.length - 1;            // the last run starting at or before it
        while (lo < hi) { const m = (lo + hi + 1) >> 1; if (b.starts[m] <= h.faceIndex) lo = m; else hi = m - 1; }
        p = b.parts[lo]; tri = h.faceIndex - b.starts[lo];
      } else { p = h.object.userData.part; tri = h.faceIndex; }
      if (!p || p.hidden) continue;
      if (sec.on && sec.plane.distanceToPoint(h.point) < 0) continue;   // cut away
      return { part: p, tri, world: h.point.clone(), cad: M.parts.worldToLocal(h.point.clone()) };
    }
    return null;
  }

  // ── selection ────────────────────────────────────────────────────────────────────
  let selection = [];
  const selMat = new THREE.MeshBasicMaterial({ color: 0x4da3ff, transparent: true, opacity: 0.45,
    side: THREE.DoubleSide, depthWrite: false, polygonOffset: true,
    polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  let selOverlays = [];
  function partOverlay(p, mat) {
    const g = new THREE.BufferGeometry();
    let m;
    if (p.mesh) {
      g.setAttribute('position', p.mesh.geometry.attributes.position);
      g.setIndex(p.mesh.geometry.index);
      m = new THREE.Mesh(g, mat);
      m.matrixAutoUpdate = false; m.userData.follow = p.mesh;
    } else {
      g.setAttribute('position', p.batch.pickGeo.attributes.position);
      g.setIndex(new THREE.BufferAttribute(p.batch.full.slice(p.iStart, p.iStart + p.iCount), 1));
      m = new THREE.Mesh(g, mat);
    }
    m.frustumCulled = false; m.renderOrder = 5;
    M.parts.add(m);
    return m;
  }
  function drawSelection() {
    for (const o of selOverlays) { o.removeFromParent(); }
    selOverlays = selection.map(p => partOverlay(p, selMat));
    const el = $('sel');
    if (!selection.length) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    const fams = [...new Set(selection.map(p => p.family))];
    const units = [...new Set(selection.map(p => p.unit))];
    const head = units.length === 1
      ? `<div class="name">${units[0]}</div>` + (selection.length > 1 ? `<div class="dim">board, lettering and components: ${selection.length} pieces</div>` : '')
      : `<div class="name">${units.length} parts</div><div class="dim">${fams.slice(0, 6).join(', ')}${fams.length > 6 ? ', …' : ''}</div>`;
    const sib = M.list.filter(p => fams.includes(p.family)).length;
    el.innerHTML = `<h4>selected</h4>${head}<div class="bar" style="margin-top:6px">
      <div class="btn" data-a="hide">hide<span class="k">x</span></div>
      <div class="btn" data-a="isolate">isolate<span class="k">i</span></div>
      <div class="btn" data-a="zoom">zoom<span class="k">z</span></div>
      ${sib > selection.length ? `<div class="btn" data-a="fam">select all ${sib} alike</div>` : ''}</div>`;
    for (const b of el.querySelectorAll('.btn')) b.onclick = () => selAction(b.dataset.a);
  }
  function clearSelection() { selection = []; drawSelection(); }
  function selAction(a) {
    if (!selection.length) return;
    if (a === 'hide') act(() => setHidden([...selection], true));
    if (a === 'isolate') { const keep = new Set(selection); act(() => setHidden(M.list.filter(p => !keep.has(p)), true)); }
    if (a === 'zoom') frameParts(selection);
    if (a === 'fam') { const f = new Set(selection.map(p => p.family));
                       selection = M.list.filter(p => f.has(p.family) && !p.hidden); drawSelection(); }
  }
  function partBox(p, box) {
    const m = p.mesh ? p.mesh.matrix : null, v = new THREE.Vector3();
    for (let i = 0; i < p.pos.length; i += 3) {
      v.set(p.pos[i], p.pos[i + 1], p.pos[i + 2]); if (m) v.applyMatrix4(m);
      box.expandByPoint(v);
    }
    return box;
  }
  function frameParts(ps) {
    const box = new THREE.Box3();
    for (const p of ps) partBox(p, box);
    if (box.isEmpty()) return;
    box.applyMatrix4(M.parts.matrixWorld);
    frameBox(box, false);
  }

  // ── the parts list ───────────────────────────────────────────────────────────────
  let partsOpen = false;
  function buildPartsUI() {
    const fams = new Map();
    for (const p of M.list) { if (!fams.has(p.family)) fams.set(p.family, []); fams.get(p.family).push(p); }
    const list = $('plist'); list.innerHTML = '';
    for (const [f, ps] of [...fams].sort((a, b) => a[0].localeCompare(b[0]))) {
      const el = document.createElement('div');
      el.className = 'fam'; el.dataset.f = f;
      el.innerHTML = `<span class="eye">●</span><span class="sw" style="background:#${ps[0].col ? '8a8f98' : ps[0].mat.color.getHexString()}"></span>` +
                     `<span>${f}</span><span class="n">${ps.length > 1 ? '×' + ps.length : ''}</span>`;
      el.querySelector('.eye').onclick = ev => { ev.stopPropagation(); act(() => setHidden(ps, !ps.every(p => p.hidden))); };
      el.onclick = () => { selection = ps.filter(p => !p.hidden); drawSelection(); };
      el.ondblclick = () => frameParts(ps);
      el._parts = ps;
      list.appendChild(el);
    }
    syncPartsUI();
  }
  function syncPartsUI() {
    const n = hiddenParts().length;
    $('bShowAll').style.display = n ? '' : 'none';
    $('bShowAll').firstChild.textContent = `show all (${n} hidden)`;
    if (!partsOpen) return;
    const q = $('pfilter').value.trim().toLowerCase();
    for (const el of $('plist').children) {
      const off = el._parts.every(p => p.hidden);
      el.classList.toggle('off', off);
      el.querySelector('.eye').textContent = off ? '○' : '●';
      el.style.display = !q || el.dataset.f.includes(q) ? '' : 'none';
    }
  }
  $('pfilter').oninput = syncPartsUI;
  function toggleParts() {
    partsOpen = !partsOpen;
    $('partsPanel').style.display = partsOpen ? 'flex' : 'none';
    $('bParts').classList.toggle('on', partsOpen);
    syncPartsUI();
  }

  // ── MEASURING, AGAINST THE KERNEL'S NUMBERS AND NOT THE TRIANGLES ────────────────
  // assembly.geo.json says what every triangle WAS: each part's faces (plane with its
  // normal, cylinder with its axis and radius, ...) with the run of triangles each one
  // owns, each edge (line, circle with centre and radius, or a sampled curve) and which
  // edges bound which face. A pick lands on a triangle; the triangle names its face; the
  // cursor then snaps to that face's own corners and edges. Every figure shown is read
  // from those records -- nothing is fitted to the mesh. All of it is in the CAD frame
  // (millimetres, Z up), which is the frame the part nodes live in.
  let mode = 'select';
  const V = (a, i) => new THREE.Vector3(a[i], a[i + 1], a[i + 2]);
  function loadGeo() {
    if (!M.geoPromise)
      M.geoPromise = fetch('assembly.geo.json?v=' + M.key).then(r => {
        if (!r.ok) throw new Error('no geometry record for this model');
        return r.json();
      }).then(j => { M.models = j.models || {}; return (M.geo = j.parts); });
    return M.geoPromise;
  }
  function faceOfTri(G, tri) {
    const r = G.r; let lo = 0, hi = r.length - 2;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (r[m] <= tri) lo = m; else hi = m - 1; }
    return lo;
  }
  function edgePolyline(e) {
    if (e[0] === 'l') return [V(e, 1), V(e, 4)];
    if (e[0] === 'c') {
      const c = V(e, 1), d = V(e, 4), s = V(e, 8), sweep = e[11];
      const n = Math.max(6, Math.ceil(Math.abs(sweep) / TAU * 72)), out = [];
      const rel = s.clone().sub(c), q = new THREE.Quaternion();
      for (let i = 0; i <= n; i++) {
        q.setFromAxisAngle(d, sweep * i / n);
        out.push(rel.clone().applyQuaternion(q).add(c));
      }
      return out;
    }
    const a = e[1], out = [];
    for (let i = 0; i < a.length; i += 3) out.push(V(a, i));
    return out;
  }
  const polyLen = pts => { let s = 0; for (let i = 1; i < pts.length; i++) s += pts[i].distanceTo(pts[i - 1]); return s; };
  // an entity in the CAD frame as the part stands NOW (a part the rig has moved carries its matrix)
  // (and a component is ONE shared record placed by a matrix: `i` names it, `m` places it)
  const GEO = part => { const g = M.geo[part.name]; return g && g.i !== undefined ? M.models[g.i] : g; };
  function xf(part) {
    const g = M.geo[part.name];
    if (!g || g.i === undefined) return part.mesh ? part.mesh.matrix : null;
    const a = g.m, inst = new THREE.Matrix4().set(a[0], a[1], a[2], a[3], a[4], a[5], a[6], a[7],
                                                  a[8], a[9], a[10], a[11], 0, 0, 0, 1);
    return part.mesh ? part.mesh.matrix.clone().multiply(inst) : inst;
  }
  const P = (v, m) => m ? v.clone().applyMatrix4(m) : v;
  const D = (v, m) => m ? v.clone().transformDirection(m) : v;
  function edgeEntity(part, ei) {
    const e = GEO(part).e[ei], m = xf(part);
    const pts = edgePolyline(e).map(p => P(p, m));
    const base = { part, edge: ei, pts };
    if (e[0] === 'l') return { ...base, kind: 'line', a: pts[0], b: pts[1] };
    if (e[0] === 'c') return { ...base, kind: 'circle', c: P(V(e, 1), m), d: D(V(e, 4), m), r: e[7], sweep: e[11] };
    return { ...base, kind: 'curve' };
  }
  function faceEntity(part, fi) {
    const G = GEO(part), f = G.f[fi], m = xf(part), base = { part, face: fi };
    switch (f[0]) {
      case 'p': return { ...base, kind: 'plane', p: P(V(f, 1), m), n: D(V(f, 4), m) };
      case 'c': return { ...base, kind: 'cyl', p: P(V(f, 1), m), d: D(V(f, 4), m), r: f[7], len: Math.abs(f[9] - f[8]) };
      case 'k': return { ...base, kind: 'cone', p: P(V(f, 1), m), d: D(V(f, 4), m), ang: f[7] };
      case 's': return { ...base, kind: 'sphere', c: P(V(f, 1), m), r: f[4] };
      case 't': return { ...base, kind: 'torus', p: P(V(f, 1), m), d: D(V(f, 4), m), R: f[7], r: f[8] };
    }
    return { ...base, kind: 'surface' };
  }
  function faceArea(part, fi) {
    const G = GEO(part), t0 = G.r[fi], t1 = G.r[fi + 1];
    const idx = part.mesh ? part.mesh.geometry.index.array : part.batch.full;
    const pos = part.mesh ? part.mesh.geometry.attributes.position.array : part.batch.pickGeo.attributes.position.array;
    const o = part.mesh ? 0 : part.iStart;
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    let s = 0;
    for (let t = t0; t < t1; t++) {
      a.fromArray(pos, idx[o + 3 * t] * 3); b.fromArray(pos, idx[o + 3 * t + 1] * 3); c.fromArray(pos, idx[o + 3 * t + 2] * 3);
      s += b.sub(a).cross(c.sub(a)).length() / 2;
    }
    return s;
  }
  const toPx = (() => { const v = new THREE.Vector3(); return p => {
    v.copy(p).applyMatrix4(M.parts.matrixWorld).project(camera);
    return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight, v.z]; }; })();
  function segDist2(px, py, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy;
    const t = l ? Math.max(0, Math.min(1, ((px - a[0]) * dx + (py - a[1]) * dy) / l)) : 0;
    const x = a[0] + t * dx - px, y = a[1] + t * dy - py;
    return [x * x + y * y, t];
  }
  // what the cursor means: a corner of the face under it, else one of its edges, else the face
  const SNAP_PT = 11, SNAP_EDGE = 8;
  function snapAt(cx, cy) {
    const hit = pickAt(cx, cy);
    if (!hit || !M.geo) return null;
    const G = GEO(hit.part);
    if (!G) return { kind: 'point', p: hit.cad, part: hit.part, pick: hit.cad, loose: true };
    const fi = faceOfTri(G, hit.tri);
    let bestV = null, bestE = null;
    for (const ei of G.fe[fi]) {
      const ent = edgeEntity(hit.part, ei), px = ent.pts.map(toPx);
      const closed = ent.kind === 'circle' && Math.abs(ent.sweep) > TAU - 1e-3;
      if (!closed) for (const k of [0, px.length - 1]) {
        const d = Math.hypot(px[k][0] - cx, px[k][1] - cy);
        if (d < SNAP_PT && (!bestV || d < bestV.d)) bestV = { d, p: ent.pts[k] };
      }
      for (let i = 1; i < px.length; i++) {
        const [d2, t] = segDist2(cx, cy, px[i - 1], px[i]);
        if (d2 < SNAP_EDGE * SNAP_EDGE && (!bestE || d2 < bestE.d2))
          bestE = { d2, ent, at: ent.pts[i - 1].clone().lerp(ent.pts[i], t) };

  // a published page does not offer it. It traces what is SHOWN, not a section cut:
  // with a cut on, the page stays with the drawn picture.
  // TWO PICTURES A VIEW: a quick one of few samples, denoised, which is nearly the
  // finished thing and is there in a third of a second, then the full one over it.
  const RT_FIRST = 24, RT_SAMPLES = 128;
  const rt = { ok: null, cam: new THREE.Matrix4(), size: '', want: 0, shown: false,
               asking: 0, ms: 0, n: 0, quad: null, error: '', prev: new THREE.Matrix4(), goal: null, asked: -1, far: 1 };
  async function rtLoad() {                        // is there a tracer behind this page?
    if (rt.ok !== null) return;
    const r = await fetchJSON('trace.json?t=' + Date.now());
    rt.ok = !!(r && r.available);
  }
  function rtDrop() { rt.want++; rt.shown = false; rt.goal = null; }
  async function rtAsk(samples = RT_FIRST) {
    const want = rt.want, pr = renderer.getPixelRatio(), poses = {};
    for (const n in nodes) poses[n] = nodes[n].matrixWorld.toArray();
    const view = { w: Math.round(innerWidth * pr), h: Math.round(innerHeight * pr), samples,
                   cam: rt.cam.toArray(), fov: camera.fov, near: camera.near, far: camera.far,
                   hidden: M.list.filter(p => p.hidden).map(p => p.name), poses, printed: asPrinted,
                   sun: KEY_DIR.toArray(), sun_strength: key.intensity,
                   bg: scene.background.clone().convertLinearToSRGB().toArray() };
    const t0 = performance.now();
    rt.asking++; fpsLine();
    try {
      const r = await fetch('trace', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                       body: JSON.stringify(view) });
      if (r.status === 200) {
        const bmp = await createImageBitmap(await r.blob(), { imageOrientation: 'flipY' });
        if (want !== rt.want) bmp.close();           // the view moved on meanwhile
        else {
          if (!rt.quad) rt.quad = new FullScreenQuad(new THREE.MeshBasicMaterial(
            { toneMapped: false, depthTest: false, depthWrite: false }));
          const m = rt.quad.material;
          if (m.map) { m.map.image.close(); m.map.dispose(); }
          m.map = new THREE.Texture(bmp);
          m.map.colorSpace = THREE.SRGBColorSpace; m.map.generateMipmaps = false;
          m.map.minFilter = m.map.magFilter = THREE.LinearFilter;
          m.map.needsUpdate = true; m.needsUpdate = true;
          rt.shown = true; rt.ms = performance.now() - t0; rt.n = samples; rt.error = '';
          if (samples < RT_SAMPLES) rtAsk(RT_SAMPLES);
        }
      } else if (r.status !== 204) { rt.error = r.statusText || 'failed'; console.warn('ray tracing:', rt.error); }
    } catch (e) { rt.error = 'failed'; console.warn(e); }
    rt.asking--; fpsLine();
  }
  // THE VIEW GLIDES TO A STOP after a drag, ever more slowly, and takes a second or two
  // to stand exactly still, long after the eye has it as stopped. Waiting for that is
  // waiting for nothing (user, 2026-10-09: err on the side of speed; a picture the view
  // has left is simply dropped). So as soon as the glide is slow, WHERE IT WILL END is
  // worked out, the picture is asked for THERE at once, and the glide is finished by
  // this code, quickly, while the picture is on its way.
  const RT_SLOW = 1e-2;                            // a frame's movement, as a share of the view
  function rtSame(a, b, tol = 1e-6) {
    const x = a.elements, y = b.elements;
    for (let i = 0; i < 15; i++) if (Math.abs(x[i] - y[i]) > (i < 12 ? tol : tol * rt.far)) return false;
    return true;
  }
  // the pose a picture should be of, or null while the view is really moving
  function rtPose() {
    const g = rt.goal;
    rt.far = camera.position.distanceTo(controls.target) || 1;
    if (g) {
      if (down || camera.position.distanceTo(g.at) > 1e-6 * rt.far) rt.goal = null;   // taken back in hand
      else {
        camera.position.lerp(g.pos, 0.35); controls.target.lerp(g.tgt, 0.35);
        if (camera.position.distanceTo(g.pos) < 1e-4 * rt.far) {
          camera.position.copy(g.pos); controls.target.copy(g.tgt); rt.goal = null;
          controls.update(); camera.updateMatrixWorld();
          rt.prev.copy(camera.matrixWorld);
          return camera.matrixWorld;                                   // arrived: g.mat, to rounding
        }
        camera.lookAt(controls.target); camera.updateMatrixWorld();
        g.at.copy(camera.position); rt.prev.copy(camera.matrixWorld);
        return g.mat;
      }
    }
    const a = camera.matrixWorld.elements, p = rt.prev.elements;
    let m = 0;
    for (let i = 0; i < 15; i++) m = Math.max(m, Math.abs(a[i] - p[i]) / (i < 12 ? 1 : rt.far));
    rt.prev.copy(camera.matrixWorld);
    if (m < 1e-7) return camera.matrixWorld;                 // still, to rounding
    if (down || m >= RT_SLOW) return null;
    // the end of the glide: what the controls would do with the rest of it in one step
    const at = camera.position.clone(), tgt = controls.target.clone();
    controls.enableDamping = false; controls.update(); controls.enableDamping = true;
    camera.updateMatrixWorld();
    rt.goal = { pos: camera.position.clone(), tgt: controls.target.clone(), mat: camera.matrixWorld.clone(), at };
    camera.position.copy(at); controls.target.copy(tgt);
    camera.lookAt(tgt); camera.updateMatrixWorld();
    rt.prev.copy(camera.matrixWorld);
    return rt.goal.mat;
  }
  // true when this frame shows the traced picture (so the drawn one must NOT be drawn over it)
  function rtFrame(changed) {
    if (quality !== 3 || !rt.ok || sec.on || !M.parts) return false;
    const pose = rtPose(), size = innerWidth + 'x' + innerHeight;
    if (changed || !pose || size !== rt.size || !rtSame(pose, rt.cam)) {
      const was = rt.shown;
      rt.shown = false; rt.want++; rt.size = size;
      if (pose) rt.cam.copy(pose); else rt.cam.identity();
      if (was) fpsLine();
    }
    // asked for as soon as there is a pose and nothing else is changing (the rig eases)
    if (pose && !changed && rt.asked !== rt.want) { rt.asked = rt.want; rtAsk(); }
    if (!rt.shown || rt.goal || !rtSame(camera.matrixWorld, rt.cam)) return false;
    rt.quad.render(renderer);
    rtOverlays();
    return true;
  }
  // the selection tint and the measure marks, over the traced picture
  function rtOverlays() {
    const off = [];
    for (const b of M.batches) if (b.draw.visible) { b.draw.visible = false; off.push(b.draw); }
    for (const p of M.list) if (p.mesh && p.mesh.visible) { p.mesh.visible = false; off.push(p.mesh); }
    const bg = scene.background, ac = renderer.autoClear;
    scene.background = null; renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(scene, camera);
    scene.background = bg; renderer.autoClear = ac;
    for (const o of off) o.visible = true;
  }
  function fitShadow() {
    const box = new THREE.Box3();
    for (const p of M.list) if (!p.hidden) box.union(p.box || (p.box = partBox(p, new THREE.Box3())));
    if (box.isEmpty()) return;
    const s = box.applyMatrix4(M.parts.matrixWorld).getBoundingSphere(new THREE.Sphere());
    const R = Math.max(s.radius, 1), c = key.shadow.camera;
    key.target.position.copy(s.center);
    key.position.copy(s.center).addScaledVector(KEY_DIR, 2 * R);
    key.target.updateMatrixWorld();
    c.left = c.bottom = -R; c.right = c.top = R; c.near = 0.01 * R; c.far = 4 * R;
    c.updateProjectionMatrix();
    key.shadow.normalBias = 3 * R / SHADOW_PX;          // a texel and a half
  }
  // anything the rig has moved since the last frame? (a sum that any motion changes)
  function rigSignature() {
    let s = 0;
    for (const n in nodes) { const e = nodes[n].matrix.elements; s += e[0] + 1.7 * e[5] + e[12] + 1.3 * e[13] + 1.9 * e[14]; }
    // to a tenth of a micron: the rig EASES to rest, and its last digits go on settling
    // for seconds after anything that could be seen has stopped
    return Math.round(s * 1e4);
  }
  function drawFrame() {
    let changed = false;
    if (quality >= 1 && M.parts) {
      const sig = rigSignature();
      changed = lightDirty || sig !== lastSig;
      if (lightDirty) fitShadow();
      if (changed) renderer.shadowMap.needsUpdate = true;
      lastSig = sig; lightDirty = false;
    }
    traced = rtFrame(changed);
    if (traced) return;
    if (quality >= 2) composer.render(); else renderer.render(scene, camera);
  }
  // called once a second with the measured rate
  function govern(fps, now) {
    if (!autoQuality || quality === 0 || document.hidden || now < settledAt) { slowFor = 0; return; }
    if (fps >= 57) { slowFor = 0; return; }
    if (++slowFor >= 2) setQuality(Math.min(quality, 3) - 1);
  }
  $('bLight').onclick = () => setQuality(quality + 1, true);
  // the model is built again from the file: parts are grouped by material when it loads
  function setPrinted(on) {
    asPrinted = on;
    try { sessionStorage.setItem('as-printed', on ? '1' : '0'); } catch {}
    $('bPrinted').classList.toggle('on', on);
    load(false).catch(e => console.error(e));
  }
  $('bPrinted').onclick = () => setPrinted(!asPrinted);
  $('bPrinted').classList.toggle('on', asPrinted);

  // ── the axis views ───────────────────────────────────────────────────────────────
  // look along a CAD direction, from that side: "+Z" is the view from above
  function viewFrom(d) {
    if (!M.parts) return;
    const dir = new THREE.Vector3(d[0], d[1], d[2]).transformDirection(M.parts.matrixWorld);
    if (Math.abs(dir.y) > 0.9999) dir.z += 1e-4;        // straight down: CAD +Y up the screen
    const dist = camera.position.distanceTo(controls.target);
    camera.position.copy(controls.target).addScaledVector(dir.normalize(), dist);
    controls.update();
  }
  for (const e of document.querySelectorAll('#views .vw'))
    e.onclick = () => viewFrom(e.dataset.d.split(',').map(Number));

  // ── frame camera to the model ─────────────────────────────────────────────
  function frameBox(box, reset = true) {
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const radius = 0.5 * Math.max(size.x, size.y, size.z, 1);
    const dist = radius / Math.sin((camera.fov * Math.PI / 180) / 2) * 1.15;
    const dir = reset ? new THREE.Vector3(0.55, 0.5, 1).normalize()
                      : camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(center).add(dir.multiplyScalar(dist));
    if (reset) { camera.near = dist / 100; camera.far = dist * 100; camera.updateProjectionMatrix(); }
    controls.target.copy(center); controls.update();
  }

  // ── load rig + model ──────────────────────────────────────────────────────
  // The same page serves two models. Published (a folder written by export(page=True))
  // it is the build that was pushed. Served locally (cadkit.web.view) it is whatever was
  // last shown, and stamp.json says when: the page reloads the model then, keeping the
  // camera and whatever was hidden.
  let stamp = null;
  async function fetchJSON(url) {
    try { const r = await fetch(url, { cache: 'no-store' }); return r.ok ? await r.json() : null; }
    catch { return null; }
  }
  async function load(first) {
    stamp = await fetchJSON('stamp.json?t=' + Date.now());
    rig = await fetchJSON('rig.json?v=' + Date.now());
    strings = rig ? rig.strings : [];
    for (const k of Object.keys(keyToPedal)) delete keyToPedal[k];
    if (rig) for (const p of rig.copedent) keyToPedal[p.key] = p.name;
    M.key = stamp ? String(stamp.t) : rig ? String(rig.build) : String(Date.now());
    $('status').textContent = stamp && stamp.scratch
      ? ['scratch view',
         stamp.live.length ? stamp.live.length + ' part(s) fresh' : 'nothing rebuilt',
         stamp.own ? stamp.own + ' kept as built here' : '',
         stamp.cache_age_min != null
           ? `the rest from build${stamp.build != null ? ' #' + stamp.build : ''}, ${Math.round(stamp.cache_age_min)} min old` : '',
         stamp.drift ? 'NOT THE SAME TREE: ' + stamp.drift : '']
        .filter(Boolean).join(' · ')
      : '';
    const hiddenNames = new Set(hiddenParts().map(p => p.name));
    const wasMode = mode;
    const gltf = await new GLTFLoader().loadAsync('assembly.glb?v=' + M.key);
    // what the export says the model IS: its name, a line about it, its build number
    const about = (gltf.asset && gltf.asset.extras) || {};
    document.title = $('title').textContent = about.title || 'Assembly';
    $('subtitle').textContent = about.subtitle ? about.subtitle + ' · ' : '';
    $('deckhint').style.display = rig && rig.deck_prefixes ? '' : 'none';
    // a scratch view is not a build: its number would be the surroundings', not its own
    const buildN = stamp && stamp.scratch ? null : about.build != null ? about.build : rig && rig.build;
    $('build').textContent = [buildN != null ? 'build #' + buildN : '',
                              stamp ? 'local · ' + new Date(stamp.t * 1000).toLocaleTimeString() : '']
                             .filter(Boolean).join(' · ');
    disposeModel();
    curCarr = null; curPress = null;
    buildModel(gltf);
    buildPedalUI(); syncUI();
    buildPartsUI();
    M.box = null; applySection();
    lightDirty = true; settledAt = performance.now() + 6000;
    if (first) frameBox(new THREE.Box3().setFromObject(M.root));
    else { setHidden(M.list.filter(p => hiddenNames.has(p.name)), true); syncDeckUI(); }
    if (wasMode === 'measure') setMode('measure');
  }
  // The local server also says when this page's own file was last edited; the page then
  // reloads itself and comes back as it was (camera, hidden parts, section, mode).
  let pageStamp = null;
  const KEEP = 'viewer-state';
  function keepState() {
    try { sessionStorage.setItem(KEEP, JSON.stringify({
      cam: camera.position.toArray(), tgt: controls.target.toArray(),
      hidden: hiddenParts().map(p => p.name), deck: deckVisible, mode,
      sec: { on: sec.on, axis: sec.axis, v: sec.v, flip: sec.flip } })); } catch {}
  }
  function restoreState() {
    let s = null;
    try { s = JSON.parse(sessionStorage.getItem(KEEP)); sessionStorage.removeItem(KEEP); } catch {}
    if (!s) return;
    camera.position.fromArray(s.cam); controls.target.fromArray(s.tgt); controls.update();
    restoreVis({ names: s.hidden, deck: s.deck });
    if (s.sec.on) setSection(true, s.sec.axis, s.sec.v, s.sec.flip);
    if (s.mode === 'measure') setMode('measure');
  }
  async function watch() {
    if (!stamp) return;
    const pg = await fetchJSON('page.json?t=' + Date.now());
    if (pg) {
      if (pageStamp === null) pageStamp = pg.t;
      else if (pg.t !== pageStamp) { keepState(); location.reload(); return; }
    }
    const s = await fetchJSON('stamp.json?t=' + Date.now());
    if (s && s.t !== stamp.t) { $('status').textContent = 'reloading…'; try { await load(false); } catch (e) { console.error(e); } }
    setTimeout(watch, 1500);
  }
  async function init() {
    setHint();
    try {
      await load(true);
      await rtLoad();
      restoreState();
      $('loading').style.opacity = '0';
      setTimeout(() => $('loading').remove(), 400);
      watch();
    } catch (err) {
      $('loading').textContent = 'failed to load model';
      console.error(err);
    }
  }

  let last = performance.now(), fpsT = last, fpsN = 0, stalled = false;
  const fpsEl = $('fps');
  let fpsNow = 0;
  function fpsLine() {                                  // also said at once when tracing starts or ends
    fpsEl.textContent = traced || rt.shown
        ? 'ray traced · ' + rt.n + ' samples in ' + (rt.ms / 1000).toFixed(2) + ' s'
        : Math.round(fpsNow) + ' fps · ' + renderer.info.render.calls + ' draws · ' +
          Math.round(renderer.info.render.triangles / 1000) + 'k tris · ' + LIGHT[quality] +
          (quality !== 3 ? '' : sec.on ? ' (not with a section cut)' : rt.asking ? ' (tracing…)'
           : rt.error ? ' (' + rt.error + ')' : ' (when still)');
  }
  function tick(now) {
    if (now - last > 250) stalled = true;               // a hidden tab, a load: not a slow device
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (++fpsN && now - fpsT >= 1000) {
      const fps = fpsNow = fpsN * 1000 / (now - fpsT);
      fpsLine();
      // a second spent tracing says nothing about how fast this device DRAWS
      if (stalled || traced) stalled = false; else govern(fps, now);
      fpsT = now; fpsN = 0;
    }
    applyRig(dt);
    controls.update();
    for (const o of selOverlays) if (o.userData.follow) o.matrix.copy(o.userData.follow.matrix);
    if (mode === 'measure' && lastMove && !down && M.geo) { setHover(snapAt(lastMove[0], lastMove[1])); lastMove = null; }
    if (meas.mid && meas.B) {
      const [x, y, z] = toPx(meas.mid), el = $('dimlabel');
      el.style.display = z < 1 ? 'block' : 'none'; el.style.left = x + 'px'; el.style.top = y + 'px';
    }
    renderer.info.reset();
    drawFrame();
    requestAnimationFrame(tick);
  }
  // for poking at it from the console (and for the checks that drive the page)
  window.viewer = { rt, renderer, scene, camera, controls, sec, setSection, undo, viewFrom, setPrinted, setQuality, get quality() { return quality; }, key, THREE,
                    frame() { controls.update(); lightDirty = true; renderer.info.reset(); drawFrame(); },
                    draw() { renderer.info.reset(); drawFrame(); return traced; }, M, meas, pickAt, snapAt, setHidden, setMode,
                    measureClick, between, showAll, get selection() { return selection; },
                    select(names) { selection = names.flatMap(n => M.byName.has(n) ? M.units.get(M.byName.get(n).unit) : []); drawSelection(); },
                    selAction, loadGeo, toPx };
  setQuality(quality);
  init();
  requestAnimationFrame(tick);
  </script>
</body>
</html>
