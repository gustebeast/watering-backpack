; Watering-backpack pump controller — v2 main board
;
; THE TARGET IS A BARE ESP32-WROOM-32E on this project's own board, NOT a dev board.
; This file used to say "QuinLED-ESP32", which is hardware this board is not, and the
; difference is the whole of the first flash: a dev board carries a USB-UART bridge
; and the two-transistor auto-reset circuit, and this board carries J6, six holes.
;
;   pio run -t upload                 # build + flash over J6 (first time / recovery)
;   pio device monitor                # serial @ 115200
;   pio run -e main-ota -t upload     # build + flash over WiFi (no adapter needed)
;
; ⚠ HOW THE BOOTLOADER IS ENTERED, because nothing on the board does it for you.
; esptool has to hold IO0 low across a reset. J6 brings out both lines so an ordinary
; 3.3 V USB-UART adapter can do it. The way names below are the ones PRINTED ON THE
; BOARD (J6's pinout block is on the BACK silk, beside the header):
;
;   J6 1  3V3              <- adapter 3V3   (or leave off and power from the pack)
;   J6 2  GND              <- adapter GND
;   J6 3  ESP_TX_TO_PROG   -> adapter RX
;   J6 4  PROG_RX_IN       <- adapter TX
;   J6 5  EN               <- adapter RTS
;   J6 6  IO0              <- adapter DTR
;
; ⚠ BOTH SERIAL WAYS ARE NAMED FROM THE BOARD'S SIDE, and getting that backwards
; is the commonest reason a first flash fails. ESP_TX_TO_PROG is an OUTPUT of this
; board, so it goes to the adapter's RX; PROG_RX_IN is this board's RX, driven by the
; adapter's TX. Do NOT wire TX to TX by matching the labels (M26: the nets were once
; TXD0/RXD0, and every adapter labels its own pins from ITS point of view, so like to
; like is output into output).
;
; With DTR/RTS landed, `pio run -t upload` resets into the bootloader by itself. With
; an adapter that does not break them out, do it by hand: hold IO0 to GND, pulse EN to
; GND and release it, then start the upload and release IO0 once it connects.
;
; ⚠ POWER FROM ONE SOURCE AT A TIME. 3V3 on J6 pin 1 is the buck's output rail, so
; landing the adapter's 3V3 while the pack is docked back-feeds one into the other.
; Either dock the pack and leave J6 pin 1 off, or feed 3V3 from the adapter with the
; pack out of the dock — which is enough to flash and talk, but NOT enough to test a
; pump, because the gate driver needs VGATE and VGATE comes from the pack.
[platformio]
; one env by default, or `pio run -t upload` uploads over USB AND then tries espota
default_envs = main-usb

[env:main-usb]
; esp32dev is the generic WROOM-32 target: 4 MB flash, default partitions (app0/app1,
; which is what the OTA env below needs). The module is a WROOM-32E; the board
; definition does not need to know that.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ⚠ 115200 FOR THE FLASH, NOT THE 460800 DEFAULT. The upload runs down six jumper
; wires to a board that has never been talked to, and a failed upload at high baud
; looks exactly like a dead board. Raise it once the board is known good.
upload_speed = 115200

; a panic on a board you cannot probe prints a backtrace of raw addresses otherwise
monitor_filters = esp32_exception_decoder, time

; This resolves to Arduino-ESP32 3.x, whose LEDC PWM uses the pin-based API
; (ledcAttach / ledcWrite(pin, duty)) — that's what src/main.cpp uses.

; ── Over-the-air flashing ──────────────────────────────────────────────
; Same build, pushed over WiFi instead of USB. Not available until the board has been
; flashed once over J6 and has joined the network.
;
; OTA auth is currently OFF (OTA_PASSWORD is empty in src/secrets.h), so anyone
; on this LAN can reflash the board. To turn it on: set a non-empty OTA_PASSWORD
; in src/secrets.h, reflash once, then uncomment upload_flags below and export the
; matching value — it is deliberately NOT stored here, since this file is committed:
;
;   PowerShell:  setx OTA_PASSWORD "..."     (once, persists across sessions)
;   bash:        export OTA_PASSWORD="..."
;
; If mDNS doesn't resolve on your network, replace upload_port with the board's
; IP address (it prints it on connect).
[env:main-ota]
extends = env:main-usb
upload_protocol = espota
upload_port = watering-backpack.local
; upload_flags = --auth=${sysenv.OTA_PASSWORD}
