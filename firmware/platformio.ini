; Watering-backpack pump controller — QuinLED-ESP32 (ESP32-WROOM-32)
;
;   pio run -t upload                 # build + flash over USB (first time / recovery)
;   pio device monitor                # serial @ 115200
;   pio run -e quinled-ota -t upload  # build + flash over WiFi (no USB needed)
;
; This resolves to Arduino-ESP32 3.x, whose LEDC PWM uses the pin-based API
; (ledcAttach / ledcWrite(pin, duty)) — that's what src/main.cpp uses.
[env:quinled-esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ── Over-the-air flashing ────────────────────────────────────────────────────
; Same build, pushed over WiFi instead of USB.
;
; OTA auth is currently OFF (OTA_PASSWORD is empty in src/secrets.h), so anyone
; on this LAN can reflash the board. To turn it on: set a non-empty OTA_PASSWORD
; in src/secrets.h, reflash once, then uncomment upload_flags below and export the
; matching value — it is deliberately NOT stored here, since this file is committed:
;
;   PowerShell:  setx OTA_PASSWORD "..."     (once, persists across sessions)
;   bash:        export OTA_PASSWORD="..."
;
; If mDNS doesn't resolve on your network, replace upload_port with the board's
; IP address (it prints it on connect).
[env:quinled-ota]
extends = env:quinled-esp32
upload_protocol = espota
upload_port = watering-backpack.local
; upload_flags = --auth=${sysenv.OTA_PASSWORD}
